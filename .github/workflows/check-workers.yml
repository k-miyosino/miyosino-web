name: Check Worker Errors

# 直近24時間に Cloudflare Workers でエラーがあれば失敗させ、GitHub のメールで知らせる。
# 予約実行の失敗のメールは、このファイルの cron を最後に変えた人に届く。手順は OPS.md
on:
  schedule:
    - cron: '0 0 * * *' # 毎日 AM9:00 JST（= 0:00 UTC）
  workflow_dispatch: # 手動実行にも対応

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      # 依存パッケージは使わない（Node.js 24 で .ts をそのまま実行する）
      - name: Check Worker errors
        run: node workers/scripts/check-worker-errors.mts
        env:
          CLOUDFLARE_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_ANALYTICS_TOKEN }}
