name: Test Frontend

# フロントエンドのテスト（src/**/*.test.ts(x)、Vitest）。PR と develop への push で動かす
# （staging・main では Deploy のビルドの前にも動く）
on:
  pull_request:
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'tsconfig.json'
      - '.github/workflows/test-frontend.yml'
  push:
    branches:
      - develop
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vitest.config.mts'
      - 'tsconfig.json'
      - '.github/workflows/test-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # 依存パッケージのインストールスクリプトは実行しない（テストには不要）
        run: npm ci --ignore-scripts

      - name: Test
        run: npm test
