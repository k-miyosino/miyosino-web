name: Test Workers

# Workers のテスト（workers/test/）。PR と、develop・staging・main への push で動かす
on:
  pull_request:
    paths:
      - 'workers/**'
      - '.github/workflows/test-workers.yml'
  push:
    branches:
      - develop
      - staging
    paths:
      - 'workers/**'
      - '.github/workflows/test-workers.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: workers/package-lock.json

      - name: Install dependencies
        working-directory: workers
        # 依存パッケージのインストールスクリプトは実行しない（テストには不要）
        run: npm ci --ignore-scripts

      - name: Test
        working-directory: workers
        run: npm test
